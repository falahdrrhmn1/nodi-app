[package]
name = "nodi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nodi data model, reliable storage, autosave, backups and search (no Win32)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust zlib compression for formula PNGs (no C code, no other deps).
miniz_oxide = "0.8"

[dev-dependencies]
serde_json = "1"
